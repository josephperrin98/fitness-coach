[project]
name = "fitness-app"
version = "0.1.0"
description = "A personal marathon coach: Whoop and Strava data, a versioned training plan, and an agent that proposes changes rather than applying them."
readme = "README.md"
requires-python = ">=3.12"
dependencies = ["mcp>=2,<3"]

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/fitness_app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
