[project]
name = "fitness-coach"
version = "0.1.0"
description = "A training-plan validator and propose-then-confirm plan store for a marathon build."
requires-python = ">=3.11"
dependencies = ["pyyaml>=6"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["coach*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
