# Training rules for the validator.
#
# Every rule carries:
#   tier        hard  -> a plan that breaks it is rejected outright
#               soft  -> a plan that breaks it can only be confirmed if the
#                        user acknowledges the rule by id
#   status      decided  -> the user has signed off on the numbers
#               proposed -> a working default, still open for discussion
#   provenance  where the number came from. One of:
#               literature | clinical | professional | personal_choice
#
# Thresholds live here, not in code, so a rule can be changed (and its
# provenance questioned) without touching the validator.

version: "0.1"

rules:
  R-REC-1:
    summary: Recovery weeks are genuinely lighter
    tier: hard
    status: decided
    params:
      max_runs: 3
      max_quality: 0
      max_long_run_km: 8
      max_fraction_of_block_peak: 0.60
      max_football: 0
      # A week flagged life_event at or below this fraction of the block peak
      # counts as a recovery week and resets the loading-week counter.
      life_event_fraction: 0.60
    provenance:
      source: personal_choice
      note: >
        Deliberately at the conservative end of the usual range. Published
        plans commonly cut recovery-week volume by 20-40%; 60% of peak is a
        personal choice based on past experience, not an evidence-based minimum.

  R-REC-2:
    summary: The week after a recovery week restarts below the last block peak
    tier: soft
    status: proposed
    params:
      max_fraction_of_last_peak: 0.90
    provenance:
      source: professional
      note: Coaching convention. Exempt from the week-over-week cap (R-LOAD-1).

  R-REC-3:
    summary: At most N loading weeks in a row before a recovery week
    tier: soft
    status: proposed
    params:
      max_loading_weeks: 4
    provenance:
      source: personal_choice
      note: A 3+1 or 4+1 rhythm is common in published plans; 4+1 chosen for this user.

  R-FREQ-1:
    summary: Run frequency ceiling, and where a 5th run is allowed
    tier: hard
    status: decided
    params:
      hard_ceiling: 5
      typical_max: 4
      five_run_week_types: [race_specific]
    provenance:
      source: personal_choice
      note: >
        3-4 runs is what the user can sustain; a 5th (easy) run is acceptable
        only in the race-specific window. Observational data associates higher
        run frequency with faster marathons, but it does not show causation.

  R-FREQ-2:
    summary: Limit how many 5-run weeks a block can contain
    tier: soft
    status: proposed
    params:
      max_five_run_weeks_per_block: {half: 3, marathon: 4}
      max_consecutive_five_run_weeks: 2
    provenance:
      source: personal_choice
      note: Numbers are a working proposal; to be confirmed.

  R-FOOT-1:
    summary: Football only in lighter week types
    tier: hard
    status: decided
    params:
      foundation: {max_per_week: 1}
      build: {max_per_window: 1, window_weeks: 2}
      race_specific: {max_per_week: 0}
      recovery: {max_per_week: 0}
      taper: {max_per_week: 0}
      race: {max_per_week: 0}
    provenance:
      source: personal_choice
      note: Impact and contact load is kept out of peak, recovery and taper weeks.

  R-INT-1:
    summary: Limit hard sessions per week
    tier: hard
    status: proposed
    params:
      max_quality_per_week: 2
    provenance:
      source: professional
      note: Common convention for recreational runners; not derived from a trial.

  R-LOAD-1:
    summary: Week-over-week volume increase caps
    tier: hard          # the 30% line is hard; the 20% line is reported as soft
    status: proposed
    params:
      soft_pct: 0.20
      hard_pct: 0.30
      small_base_km: 20       # below this, a flat allowance also applies
      small_base_abs_km: 3
    provenance:
      source: literature
      note: >
        The "10% rule" is not supported by trials: Buist 2008 (532 novices) and
        Nielsen 2014 (874 novices) found no significant injury difference for
        faster progression. The caps here are monitoring thresholds, not
        proven safe limits.

# Day-of gates. These apply to a flagged "caution area" (a joint with history),
# which the user names in private config. No health detail lives in this file.
gates:
  caution_area:
    run_go_max: 2        # 0-2: train as planned
    run_modify_max: 4    # 3-4: modify (shorter, flatter, easier)
                         # >=5: no running
    maximal_effort_max: 1  # time trials and all-out tests need a stricter score
    provenance:
      source: personal_choice
      note: Ladder is a proposal pending professional (physio) confirmation.

# Scoring: how closely the plan was followed. These numbers judge the athlete,
# not the plan, so they never reject anything; they colour the dashboard.
scoring:
  adherence:
    shortfall_rate: 1.0   # each 1% short of target costs 1 point
    overshoot_rate: 0.5   # each 1% over costs 0.5 points (falling short is worse)
    moved_penalty: 10     # done on another day of the same week
    done_band: 0.05       # within 5% of target is labelled "done"; the score still counts every minute
  provenance:
    source: personal_choice
    note: >
      Asymmetric on purpose: missing volume loses the training stimulus, while
      overshooting mostly adds fatigue, which the load rules and the recovery
      views already watch. Rates are the owner's choice, not from a study.
      The done band only changes the label: watch and GPS data never match a
      target exactly, so an exact-match rule would never show a session as done.

# Paces (D29, D30). intensity: fractions of VDOT that set each pace band.
# progression: how fast planned paces may move ahead of measured fitness.
paces:
  intensity:
    easy: [0.62, 0.70]
    long: [0.62, 0.70]
    threshold: [0.86, 0.90]
    interval: [0.95, 1.00]
    provenance:
      source: literature
      note: >
        Daniels and Gilbert's VDOT model (Daniels' Running Formula). Easy and
        interval bands sit inside Daniels' ranges; the threshold band's upper
        bound (0.90) is slightly above his threshold intensity, so its fast end
        runs a little quick. Race pace is not a fraction: it is the race time the VDOT predicts.
  progression:
    cap_above_checkpoint: 1.0   # paces never assume more than 1 VDOT point above the last test
    target_lead_days: 14        # reach the target VDOT two weeks before the race
    provenance:
      source: personal_choice
      note: The plan may aim high; evidence limits how far it runs ahead. Owner's choice.
